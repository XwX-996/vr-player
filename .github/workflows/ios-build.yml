name: iOS Build IPA (Unsigned)

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

env:
  PROJECT_NAME: vr-player
  SCHEME: vr-player
  WORKSPACE: vr-player.xcworkspace
  BUNDLE_ID: cxc.vr-player
  BUILD_CONFIGURATION: Release
  DESTINATION: generic/platform=iOS
  OUTPUT_DIR: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build configuration
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BUILD_CONFIGURATION=${{ inputs.configuration }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "BUILD_CONFIGURATION=Release" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONFIGURATION=Release" >> "$GITHUB_ENV"
          fi
          echo "Using build configuration: $BUILD_CONFIGURATION"

      # Note: macos-latest already ships with the latest stable Xcode pre-installed,
      # so we skip the maxim-lobanov/setup-xcode action entirely. That action is also
      # prone to transient 429 rate-limit failures when downloading from codeload.
      - name: Select default Xcode
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          echo "Selected Xcode: $(xcode-select -p)"

      - name: Print build environment
        shell: bash
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo ""
          echo "=== Available iOS SDKs ==="
          xcodebuild -showsdks 2>/dev/null | grep -i iphoneos || echo "(no iphoneos sdk filter matched)"
          echo ""
          echo "=== Ruby / Gem ==="
          ruby --version
          gem --version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        shell: bash
        run: |
          gem install cocoapods --no-document
          echo "CocoaPods version:"
          pod --version

      - name: Run pod install
        shell: bash
        run: |
          pod install --repo-update

      - name: Verify workspace & list schemes
        shell: bash
        run: |
          if [ ! -d "$WORKSPACE" ]; then
            echo "ERROR: Workspace $WORKSPACE not found"
            exit 1
          fi
          xcodebuild -workspace "$WORKSPACE" -list

      - name: Resolve Swift Package dependencies
        shell: bash
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            2>&1 | tail -20

      - name: Build compile check
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination "$DESTINATION" \
            -derivedDataPath "${OUTPUT_DIR}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_BITCODE=NO \
            | xcbeautify --renderer github-actions

      - name: Create xcarchive (unsigned)
        id: archive
        shell: bash
        run: |
          set -o pipefail
          ARCHIVE_PATH="${OUTPUT_DIR}/${PROJECT_NAME}.xcarchive"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_OUTPUT"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIGURATION" \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "${OUTPUT_DIR}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_BITCODE=NO \
            | xcbeautify --renderer github-actions

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "ERROR: Archive directory not created at $ARCHIVE_PATH"
            ls -la "${OUTPUT_DIR}/" 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "Archive size: $(du -sh "$ARCHIVE_PATH" | cut -f1)"
          echo "Products/Applications content:"
          ls -la "$ARCHIVE_PATH/Products/Applications/" 2>/dev/null || true

      - name: Extract .app version
        shell: bash
        run: |
          APP_PATH=$(find "${{ steps.archive.outputs.archive_path }}/Products/Applications" -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi
          APP_BASENAME=$(basename "$APP_PATH")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString"  "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion"          "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"             "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
          echo "APP_PATH=$APP_PATH"                     >> "$GITHUB_ENV"
          echo "APP_BASENAME=$APP_BASENAME"             >> "$GITHUB_ENV"
          echo "APP_SHORT_VERSION=$SHORT_VERSION"       >> "$GITHUB_ENV"
          echo "APP_BUNDLE_VERSION=$BUNDLE_VERSION"     >> "$GITHUB_ENV"
          echo "APP_BUNDLE_ID=$BUNDLE_ID"               >> "$GITHUB_ENV"
          echo "App: $APP_BASENAME  version=$SHORT_VERSION($BUNDLE_VERSION)  id=$BUNDLE_ID"

      - name: Build unsigned IPA via Payload packaging
        id: ipa
        shell: bash
        run: |
          # Resolve to absolute paths - critical because we `cd` below and
          # relative paths like "build/..." would no longer resolve.
          REPO_ROOT="$(pwd)"
          STAGE_DIR="${REPO_ROOT}/${OUTPUT_DIR}/ipa-stage"
          IPA_DIR="${REPO_ROOT}/${OUTPUT_DIR}"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/Payload"

          # Copy .app into Payload
          cp -R "$APP_PATH" "$STAGE_DIR/Payload/"

          # Build filename (include tag/commit for traceability)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF_NAME}
            IPA_FILENAME="${PROJECT_NAME}-${TAG}-unsigned.ipa"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            IPA_FILENAME="${PROJECT_NAME}-${SHORT_SHA}-unsigned.ipa"
          fi
          IPA_PATH="${IPA_DIR}/${IPA_FILENAME}"

          # Create zip and rename to .ipa (cd into stage dir so zip stores
          # "Payload/..." as the top-level entry, not the full path)
          (
            cd "$STAGE_DIR"
            zip -qry "$IPA_PATH" "Payload"
          )

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: IPA was not created at $IPA_PATH"
            ls -la "$IPA_DIR" 2>/dev/null || true
            exit 1
          fi

          echo "ipa_filename=$IPA_FILENAME" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$IPA_PATH"         >> "$GITHUB_OUTPUT"
          echo ""
          echo "IPA created: $IPA_FILENAME  ($(du -h "$IPA_PATH" | cut -f1))"
          echo "IPA path: $IPA_PATH"
          echo ""
          echo "=== IPA contents (first few lines) ==="
          unzip -l "$IPA_PATH" | head -20

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-xcarchive-${{ github.run_number }}
          path: ${{ steps.archive.outputs.archive_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.ipa_filename }}
          path: ${{ steps.ipa.outputs.ipa_path }}
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release and attach artifacts (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE_PATH="${{ steps.archive.outputs.archive_path }}"
          IPA_PATH="${{ steps.ipa.outputs.ipa_path }}"

          # gh release upload 需要文件而非目录, 先把 xcarchive 压成 zip
          ARCHIVE_ZIP="${OUTPUT_DIR}/${PROJECT_NAME}.xcarchive.zip"
          (
            cd "${OUTPUT_DIR}"
            rm -f "${PROJECT_NAME}.xcarchive.zip"
            zip -qry "${PROJECT_NAME}.xcarchive.zip" "${PROJECT_NAME}.xcarchive"
          )

          # 写 release notes 到临时文件
          NOTES_FILE="$(mktemp /tmp/release-notes.XXXXXX.md)"
          cat > "$NOTES_FILE" <<EOF
          **Unsigned build** - sign locally before installing on device.

          | Item | Value |
          |---|---|
          | App | ${APP_BASENAME} |
          | Version | ${APP_SHORT_VERSION} (${APP_BUNDLE_VERSION}) |
          | Bundle ID | ${APP_BUNDLE_ID} |
          | Commit | ${GITHUB_SHA} |
          | Workflow Run | #${GITHUB_RUN_NUMBER} |
          EOF

          echo "Creating release for tag $TAG"
          gh release create "$TAG" \
            --title "${PROJECT_NAME} ${APP_SHORT_VERSION} (${APP_BUNDLE_VERSION}) - unsigned" \
            --notes-file "$NOTES_FILE" \
            "$IPA_PATH" "$ARCHIVE_ZIP"

          echo "Release created: $TAG"

      - name: Summary
        shell: bash
        run: |
          echo "## ✅ iOS Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **App** | \`${APP_BASENAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${APP_SHORT_VERSION}\` (build \`${APP_BUNDLE_VERSION}\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Bundle ID** | \`${APP_BUNDLE_ID}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Config** | \`${BUILD_CONFIGURATION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Code Signed** | ❌ No - unsigned. Sign locally before installing. |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Archive Artifact** | \`${PROJECT_NAME}-xcarchive-${{ github.run_number }}\` (14 days) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **IPA Artifact** | \`${{ steps.ipa.outputs.ipa_filename }}\` (90 days) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Local signing options" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Sideloadly / AltStore**: drag & drop the IPA with your free dev account" >> "$GITHUB_STEP_SUMMARY"
          echo "- **ios-app-signer**: GUI tool, pick app + cert + profile → resigned IPA" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Fastlane sigh/resign**: \`fastlane sigh resign path/to.ipa\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Xcode** Devices window: drag signed IPA to connected device" >> "$GITHUB_STEP_SUMMARY"
